# ~/.config/hypr/hyprsunset.conf — blue-light filter.
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
#
# hyprsunset runs as a daemon; ~/.local/bin/toggle-nightlight starts and stops
# it, and Waybar's custom/nightlight module shows whether it is running.
# The temperature can also be changed at runtime:
#   hyprctl hyprsunset temperature 4500

# Clamp the gamma correction so the screen can never be darkened to the point of
# being unreadable.
max-gamma = 100

# Evening profile: warm, from 20:00.
profile {
    time = 20:00
    temperature = 4000
    gamma = 100
}

# Daytime profile: effectively neutral, from 07:00.
profile {
    time = 07:00
    temperature = 6500
    gamma = 100
}
