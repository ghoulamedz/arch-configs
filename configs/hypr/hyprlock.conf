# ~/.config/hypr/hyprlock.conf — the lock screen.
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Colours are the Tokyo Night palette, matching looknfeel.lua.

# Blurred screenshot of the desktop, darkened, as the background.
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(1a1b26ee)
}

# The password field.
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(7aa2f7ff)
    inner_color = rgba(1a1b26ff)
    font_color = rgba(a9b1d6ff)
    fade_on_empty = false
    rounding = 8
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
}

# Clock. cmd[update:1000] re-runs the command every second, so the time is live
# rather than frozen at the moment the screen locked.
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(a9b1d6ff)
    font_size = 96
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

# Date, updated once a minute.
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(565f89ff)
    font_size = 20
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}
