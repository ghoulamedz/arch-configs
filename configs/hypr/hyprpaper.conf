# ~/.config/hypr/hyprpaper.conf — the wallpaper engine.
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
#
# Paths are absolute: hyprpaper does not expand ~.
# The four images are installed into ~/Pictures/wallpapers/ by install-chroot.sh.
# Change the wallpaper at runtime with ~/.local/bin/wallpaper-picker or
# wallpaper-cycle; this file only sets what appears at login.
#
# NOTE: This file is a template. install-chroot.sh replaces @HOME@ with the actual
# user home directory at install time.

# Wallpaper configuration (hyprpaper v0.8+ syntax)
wallpaper {
    monitor = 
    path = @HOME@/Pictures/wallpapers/winding-road.jpg
    fit_mode = cover
}

# No splash overlay while the wallpaper loads.
splash = false

# Enable the IPC socket. hyprpaper must have this on for `hyprctl hyprpaper ...`
# to work, which is how wallpaper-picker and wallpaper-cycle change the image.
ipc = on
