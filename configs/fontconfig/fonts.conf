<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ~/.config/fontconfig/fonts.conf — the font stack.

  Why this file exists: without it, fontconfig picks whatever it finds first for
  Arabic text, which on a stock Arch install is a font nobody would choose. The
  rules below bind each script and role to a specific family.

  Families this file refers to, and where they come from:

    Inter                    inter-font                      Latin UI
    JetBrainsMono Nerd Font  ttf-jetbrains-mono-nerd-basic   Latin monospace + icons
    Symbols Nerd Font        ttf-nerd-fonts-symbols          icon fallback
    Vazirmatn                vazirmatn-fonts (AUR)           Arabic UI
    Scheherazade New         ttf-scheherazade-new            Arabic reading
    Amiri                    ttf-amiri (AUR)                 Arabic serif
    Noto Color Emoji         noto-fonts-emoji                emoji
    Noto Sans                noto-fonts                      catch-all fallback

  Several names are listed per role on purpose: fontconfig ignores a family that
  is not installed, so a wrong or renamed family degrades to the next one
  instead of falling back to something unreadable.

  Check what actually resolves with:
    fc-match "sans-serif:lang=ar"
    fc-match "serif:lang=ar"
    fc-match monospace
-->
<fontconfig>

  <!-- =====================================================================
       Generic families, in fallback order.
       ===================================================================== -->

  <!-- Latin UI: Inter first, then Vazirmatn so Arabic glyphs inside a Latin
       string resolve, then Noto Sans, then emoji. -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Vazirmatn</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Monospace: the terminal and code. Symbols Nerd Font sits second so any
       icon glyph the -basic Nerd Font build lacks is still drawn. -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Symbols Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Serif: documents and long-form reading. -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Scheherazade New</family>
      <family>Amiri</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- =====================================================================
       Arabic.
       The lang test matches any pattern whose language set contains "ar".
       mode="prepend" binding="strong" puts the family in front of whatever the
       application asked for, which is what makes Arabic actually use it.
       ===================================================================== -->

  <!-- Arabic UI text: Vazirmatn is a modern sans with full Arabic coverage and
       proper diacritic positioning. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <test name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Vazirmatn</string>
    </edit>
  </match>

  <!-- Arabic in a serif context: Scheherazade New is SIL's Naskh face, the best
       free font for reading Arabic prose and Quranic text. Amiri is the
       classical alternative behind it. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <test name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Scheherazade New</string>
      <string>Amiri</string>
    </edit>
  </match>

  <!-- Arabic in a monospace context. There is no true monospace Arabic font in
       this set; Vazirmatn at least shapes and joins correctly. -->
  <match target="pattern">
    <test name="lang" compare="contains">
      <string>ar</string>
    </test>
    <test name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Vazirmatn</string>
    </edit>
  </match>

  <!-- Arabic-Indic digits (٠١٢٣٤٥٦٧٨٩) CANNOT be selected here.
       fontconfig chooses FONTS, not glyph variants: a font that contains both
       ASCII and Arabic-Indic digits will always render U+0030 as `0`, and no
       rule can change that. An earlier version of this file carried a commented
       block claiming to do it — it was inert and misleading, so it is gone.

       If you want Arabic-Indic digits, the working mechanisms are:
         - the compose sequences in ~/.XCompose (Caps then 0-9), or
         - an Arabic keyboard layout, or
         - an input method that emits them. -->

  <!-- =====================================================================
       Emoji.
       ===================================================================== -->

  <alias>
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Emoji are bitmap glyphs; hinting and hint metrics distort them. -->
  <match target="font">
    <test name="family">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="hinting" mode="assign">
      <bool>false</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintnone</const>
    </edit>
  </match>

  <!-- =====================================================================
       Rendering.
       ===================================================================== -->

  <!-- Slight hinting and grayscale antialiasing: the best compromise for a
       1080p panel, and what Inter and JetBrains Mono are designed for. -->
  <match target="font">
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="rgba" mode="assign">
      <const>none</const>
    </edit>
  </match>

  <!-- No line-height rule here, on purpose.
       fontconfig has no line-height/lineheight property — its vertical metrics
       are ascent, descent, charheight and minspace — so an `<edit
       name="lineheight">` would be stored on the pattern and read by nobody.
       Arabic diacritic spacing is handled where it can actually be set: the
       `cell-height`/`line-height` option of the terminal, and the per-app
       setting of whatever editor you use. Scheherazade New and Amiri already
       have generous ascent/descent built in, which is most of the benefit. -->

</fontconfig>
