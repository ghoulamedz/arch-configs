# ~/.config/fuzzel/fuzzel.ini — the application launcher.
# Reference: https://man.archlinux.org/man/fuzzel.ini.5
#
# Bound to SUPER + SPACE. It reads .desktop files from
# ~/.local/share/applications, /usr/local/share/applications and
# /usr/share/applications, and matches on Name, GenericName, Comment, Keywords
# and Exec — so typing the first few letters of anything finds it.

[main]
# The prompt shown at the start of the input line.
prompt=> 

# Show each entry's icon.
icons-enabled=yes

# Terminal used for .desktop entries that declare Terminal=true.
terminal=foot

# How many matches to show at once.
lines=10

# Window geometry: width in characters, and the padding around the list.
width=34
horizontal-pad=16
vertical-pad=12
inner-pad=8

# Size the window using the monitor's DPI, so it is not tiny on a scaled display.
dpi-aware=yes

# Font. The Nerd Font is needed for the icons in the list.
font=JetBrainsMono Nerd Font:size=11

# Tokyo Night. fuzzel wants 8-digit RRGGBBAA hex without a leading '#'.
[colors]
background=1a1b26ff
text=a9b1d6ff
match=7aa2f7ff
selection=292e42ff
selection-text=c0caf5ff
selection-match=bb9af7ff
border=7aa2f7ff

[border]
width=2
radius=8
