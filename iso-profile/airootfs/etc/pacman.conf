#
# /etc/pacman.conf
# See the pacman.conf(5) manpage for option and repository directives

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 8
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Custom local repository for arch-configs AUR packages (highest priority)
[arch-configs-aur]
SigLevel = Optional TrustAll
Server = file:///run/archiso/bootmnt/arch-configs-aur

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

