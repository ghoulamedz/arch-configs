[Settings]
# Adwaita is built into GTK3 itself, so no theme package is needed for it. The
# dark variant is selected by the prefer-dark setting below rather than by asking
# for a theme called "Adwaita-dark", which would need gnome-themes-extra
# installed for the file to exist.
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1

# Icons and cursors come from adwaita-icon-theme, which gtk3 already depends on.
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

# Inter for UI text, matching the Waybar font and the fontconfig stack.
gtk-font-name=Inter 11

gtk-enable-animations=true

# Use the same font in the toolbar and the menu as everywhere else.
gtk-menu-images=1
gtk-button-images=0
