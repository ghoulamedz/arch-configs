# ~/.config/hypr/hypridle.conf — idle behaviour.
# Reference: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
#
# This file is also the keep-awake switch: ~/.local/bin/toggle-idle stops and
# starts the hypridle process, and Waybar's custom/keepawake module shows which
# state it is in.

general {
    # Lock with hyprlock, but never start a second instance if one is running.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before the machine suspends, so it is already locked on resume.
    before_sleep_cmd = loginctl lock-session

    # Turn the panel back on after resuming.
    after_sleep_cmd = hyprctl dispatch dpms on

    # Respect applications that ask to inhibit idle (video players, browsers
    # playing media). Set true to ignore those requests and always go idle.
    ignore_dbus_inhibit = false
}

# 5 minutes: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 minutes: turn the panel off.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 minutes: suspend. Hibernation is not configured on this machine.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
