# /etc/vconsole.conf — console (TTY) settings, applied by systemd-vconsole-setup
# at boot, using the keymap from the kbd package.

# fr-pc is the PC-style French AZERTY layout, chosen for the TTY and for any
# pre-graphical console.
#
# Hyprland does NOT read this file: it uses xkb's `fr` layout, configured in
# configs/hypr/input.lua, together with Arabic as the second layout.
KEYMAP=fr-pc
