# /etc/systemd/zram-generator.conf — a compressed swap device in RAM, created at
# boot by the systemd unit that ships with zram-generator.
#
# This machine has no swap partition and no swap file. With 24 GB of RAM and
# hibernation deliberately not configured, zram is the whole swapping story:
# cold anonymous pages are compressed and kept in memory, which is far faster
# than a disk swap file and never wears the NVMe.

[zram0]
# Half of RAM. Larger is not better — the device only holds compressed cold
# pages, and a device bigger than the data it compresses adds no benefit.
zram-size = ram / 2

# zstd compresses noticeably better than lz4 at comparable decompression speed,
# and this is a 20-thread CPU with cycles to spare.
compression-algorithm = zstd
