# /etc/mkinitcpio.conf.d/20-nvidia.conf
#
# Sorts after 10-system.conf, so MODULES already contains btrfs and this appends
# rather than replaces it.

# Early-load the NVIDIA modules, so the driver's modesetting happens before SDDM
# starts. Without this the display manager can come up before the GPU is ready
# and Hyprland fails to start on the NVIDIA output.
#
# This pairs with /etc/modprobe.d/nvidia.conf, which sets nvidia_drm
# modeset=1 — the module must be loaded for that option to apply.
MODULES+=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)
