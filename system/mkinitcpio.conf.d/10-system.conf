# /etc/mkinitcpio.conf.d/10-system.conf
#
# mkinitcpio sources every file in this directory after /etc/mkinitcpio.conf, so
# these settings extend the packaged defaults without editing the packaged file.

# btrfs is the root filesystem. Listed explicitly so it is always present in the
# initramfs, rather than relying on autodetect's heuristics.
MODULES=(btrfs)

# systemd-based initramfs.
#   base       minimal busybox-less foundation
#   systemd    replaces udev; required for the sd-* hooks
#   autodetect  trims the image to this machine's hardware
#   microcode  loads intel-ucode before the kernel
#   modconf    processes /etc/modprobe.d (where nvidia_drm modeset=1 lives)
#   kms        early kernel modesetting; kept because the Intel iGPU needs it
#   keyboard   needed for the sd-vconsole hook's keymap
#   sd-vconsole replaces the udev pair `keymap` + `consolefont`
#   block      required to find the root device
#   filesystems mounts the root
#   fsck       runs a filesystem check when needed
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block filesystems fsck)
