# /etc/sddm.conf.d/10-theme.conf
#
# sddm reads /etc/sddm.conf first, then every file in /etc/sddm.conf.d/ in
# alphabetical order, so these values win over the packaged defaults and survive
# a package update to /etc/sddm.conf.

[Theme]
# Theme to use (requires sddm-theme-adwaita package)
Current=adwaita
# Cursor theme and size, so the login screen matches the desktop session instead
# of falling back to whatever the theme defaults to.
CursorTheme=Adwaita
CursorSize=24

[General]
# Turn numlock on at the login screen.
Numlock=on
